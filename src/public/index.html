<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EasySAV · Assistant de pré-diagnostic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="h-dvh overflow-hidden bg-slate-50 font-sans text-slate-900 antialiased">
  <main class="flex h-full flex-col">
    <header class="flex items-center gap-3 bg-slate-950 px-4 py-3 sm:px-6">
      <div class="flex size-10 items-center justify-center rounded-xl bg-gradient-to-br from-cyan-400 to-blue-600 text-white shadow-lg shadow-blue-900/40">
        <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
      </div>
      <div>
        <p class="text-lg leading-tight font-bold text-white">Easy<span class="text-cyan-400">SAV</span></p>
        <p class="text-xs text-slate-300">Assistant de pré-diagnostic</p>
      </div>
    </header>

    <section id="chat" class="flex-1 overflow-y-auto" aria-live="polite">
      <div class="mx-auto w-full max-w-3xl px-4 py-8 sm:px-6">
        <div id="welcome" class="flex flex-col items-center pt-6 text-center sm:pt-12">
          <div class="flex size-16 items-center justify-center rounded-2xl bg-gradient-to-br from-cyan-400 to-blue-600 text-white shadow-xl shadow-blue-600/25">
            <svg class="size-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
          </div>
          <h1 class="mt-6 text-2xl font-bold text-slate-900 sm:text-3xl">Bonjour, quel appareil vous pose problème ?</h1>
          <p class="mt-3 max-w-xl text-slate-600">Décrivez la panne de votre appareil électronique pour obtenir un pré-diagnostic avant sa prise en charge par le SAV.</p>
        </div>

        <div id="messages" class="space-y-6" hidden></div>
      </div>
    </section>

    <footer class="border-t border-slate-200 bg-white px-4 pt-4 pb-5 sm:px-6">
      <form id="prompt-form" class="mx-auto w-full max-w-3xl">
        <label for="prompt" class="sr-only">Décrivez votre problème</label>
        <div class="flex items-center gap-2 rounded-2xl border-2 border-slate-300 bg-white p-2 transition focus-within:border-blue-600 focus-within:ring-4 focus-within:ring-blue-100">
          <textarea id="prompt" rows="2" placeholder="Décrivez votre problème : appareil, symptômes, depuis quand…" class="flex-1 resize-none bg-transparent px-3 py-2 text-base text-slate-900 placeholder:text-slate-500 focus:outline-none" required></textarea>
          <button type="submit" class="flex size-11 shrink-0 items-center justify-center rounded-xl bg-blue-600 text-white transition hover:bg-blue-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 disabled:cursor-not-allowed disabled:bg-slate-300 disabled:text-slate-600" aria-label="Envoyer">
            <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg>
          </button>
        </div>
      </form>
    </footer>
  </main>
  <script src="/app.js"></script>
</body>
</html>
